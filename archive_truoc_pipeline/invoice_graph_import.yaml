version: v2

clientSettings:
  retry: 3
  concurrency: 10
  channelBufferSize: 128
  space: invoice_graph
  connection:
    addresses:
      - 127.0.0.1:9669
    user: root
    password: nebula

removeTempFiles: false
logPath: ./import_log.log

files:
  # ============================
  # IMPORT ĐỈNH: Công ty
  # company.csv cột: mst(0), ten_cong_ty(1), linh_vuc(2), dia_chi(3), doanh_thu(4), nam_bao_cao(5)
  # ============================
  - path: ./company.csv
    failDataPath: ./err/company.csv
    batchSize: 128
    type: csv
    csv:
      withHeader: false   # tắt để tránh importer tự ánh xạ thừa cột
      delimiter: ","
    schema:
      type: vertex
      vertex:
        vid:
          index: 0        # mst
          type: string
        tags:
          - name: company
            props:
              - name: ten_cong_ty
                type: string
                index: 1
              - name: linh_vuc
                type: string
                index: 2
              - name: dia_chi
                type: string
                index: 3
              - name: doanh_thu
                type: int
                index: 4
              - name: nam_bao_cao
                type: string
                index: 5

  # ============================
  # IMPORT CẠNH: Hóa đơn giao dịch
  # invoice.csv cột: so_hoa_don(0), ngay_xuat(1), mst_nguon(2), mst_dich(3), mo_ta(4),
  #                  tien_chua_thue(5), thue_gtgt(6), loai_gd(7), nhan_ai(8), rank(9)
  # rank(9) BẮT BUỘC — không có thì NebulaGraph coi mọi hoá đơn cùng cặp (src,dst) là
  # 1 cạnh duy nhất (mặc định rank=0) và ghi đè lẫn nhau, mất gần hết dữ liệu hoá đơn.
  # ============================
  - path: ./invoice.csv
    failDataPath: ./err/invoice.csv
    batchSize: 128
    type: csv
    csv:
      withHeader: false   # tắt để tránh importer tự ánh xạ thừa cột
      delimiter: ","
    schema:
      type: edge
      edge:
        name: xuat_hoa_don
        srcVID:
          index: 2        # mst_nguon
          type: string
        dstVID:
          index: 3        # mst_dich
          type: string
        rank:
          index: 9        # số thứ tự tăng dần, đảm bảo mỗi hoá đơn là 1 cạnh riêng
        props:
          - name: so_hoa_don
            type: string
            index: 0
          - name: ngay_xuat
            type: string
            index: 1
          - name: mo_ta
            type: string
            index: 4
          - name: tien_chua_thue
            type: int
            index: 5
          - name: thue_gtgt
            type: int
            index: 6
          - name: loai_gd
            type: string
            index: 7
          - name: nhan_ai
            type: int
            index: 8